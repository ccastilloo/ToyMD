[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ToyMD"
version = "0.1.0"
description = "Educational one-dimensional molecular dynamics Sim with Python."
readme = "README.md"
requires-python = ">=3.7"
authors = [{name = "Carlos Castillo"}]
dependencies = ["numpy>=1.17", "matplotlib>=3.3"]

[project.optional-dependencies]
notebooks = ["ipython>=7", "jupyterlab>=3", "scipy>=1.5"]
dev = ["pytest>=7", "build>=0.10", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py37"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
